<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Think Lab - Books on Thinking</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: transparent;
    color: #263238;
  }

  .books-page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 25px 18px 35px;
  }

  /* ---------- HEADER ---------- */

  .page-header {
    text-align: center;
    margin-bottom: 25px;
  }

  .page-header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .page-header .subtitle {
    margin-top: 8px;
    font-size: 15px;
    color: #667085;
  }

  /* ---------- FILTERS ---------- */

  .filters {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 25px;
  }

  .filters select {
    min-width: 170px;
    padding: 10px 35px 10px 12px;
    border: 1px solid #d5dbe3;
    border-radius: 8px;
    background: white;
    color: #263238;
    font-size: 14px;
    cursor: pointer;
  }

  /* ---------- BOOK GRID ---------- */

  .books-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }

  /* ---------- BOOK CARD ---------- */

  .book-card {
    background: transparent;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e5e9ef;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
  }

  .book-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
  }

  /* ---------- COVER ---------- */

  .cover-container {
    width: 100%;
    height: 285px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cover-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 12px;
  }

  /* ---------- DETAILS ---------- */

  .book-details {
    padding: 15px 15px 16px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    background: #ffffff;
  }

  .book-name {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .author {
    font-size: 13px;
    color: #667085;
    margin-bottom: 10px;
  }

  .book-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 15px;
  }

  .tag {
    display: inline-block;
    background: #f1f5f9;
    color: #475467;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 20px;
  }

  /* ---------- BUY BUTTON ---------- */

  .buy-button {
    display: block;
    margin-top: auto;
    padding: 10px 12px;
    text-align: center;
    text-decoration: none;
    border-radius: 7px;
    background: #1a73e8;
    color: white;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.2s ease;
  }

  .buy-button:hover {
    background: #1557b0;
  }

  /* ---------- PAGINATION ---------- */

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 30px;
    flex-wrap: wrap;
  }

  .page-button {
    min-width: 36px;
    height: 36px;
    border: 1px solid #d5dbe3;
    background: white;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
  }

  .page-button:hover {
    background: #f1f5f9;
  }

  .page-button.active {
    background: #1a73e8;
    color: white;
    border-color: #1a73e8;
  }

  .page-button:disabled {
    opacity: 0.45;
    cursor: default;
  }

  /* ---------- STATUS ---------- */

  .status {
    text-align: center;
    padding: 30px 10px;
    color: #667085;
    font-size: 14px;
  }

  .book-count {
    text-align: center;
    color: #667085;
    font-size: 13px;
    margin-top: 5px;
    margin-bottom: 20px;
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width: 1000px) {
    .books-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .cover-container {
      height: 270px;
    }
  }

  @media (max-width: 700px) {
    .books-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .cover-container {
      height: 250px;
    }

    .book-details {
      padding: 12px;
    }

    .book-name {
      font-size: 15px;
    }
  }

  @media (max-width: 450px) {
    .books-grid {
      grid-template-columns: 1fr;
    }

    .cover-container {
      height: 330px;
    }

    .filters {
      flex-direction: column;
    }

    .filters select {
      width: 100%;
      max-width: 300px;
    }
  }
</style>
</head>

<body>

<div class="books-page">

  <div class="page-header">
    <h1>Think Lab</h1>
    <div class="subtitle">
      Books on Thinking
    </div>
  </div>

  <div class="filters">

    <select id="categoryFilter">
      <option value="all">All Categories</option>
    </select>

    <select id="languageFilter">
      <option value="all">All Languages</option>
    </select>

  </div>

  <div id="bookCount" class="book-count"></div>

  <div id="booksGrid" class="books-grid">
    <div class="status">Loading books...</div>
  </div>

  <div id="pagination" class="pagination"></div>

</div>


<script>

/* =========================================================
   THINK LAB BOOKS
   Google Sheets Published CSV
   ========================================================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSRrWjgpCdgZdXvw8wCH27chZROO882LQqipfpa01vXuIuEEe8AbaSunCUvA5xLgoY1rHR9Jtw2nvdw/pub?gid=0&single=true&output=csv";


/* Number of books shown on each page */
const BOOKS_PER_PAGE = 2;


/* Data */
let allBooks = [];
let filteredBooks = [];
let currentPage = 1;


/* =========================================================
   CSV PARSER
   Handles commas inside quoted fields
   ========================================================= */

function parseCSV(text) {

  const rows = [];
  let row = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      value += '"';
      i++;
    }

    else if (char === '"') {
      insideQuotes = !insideQuotes;
    }

    else if (char === ',' && !insideQuotes) {
      row.push(value.trim());
      value = "";
    }

    else if ((char === '\n' || char === '\r') && !insideQuotes) {

      if (char === '\r' && next === '\n') {
        i++;
      }

      row.push(value.trim());
      value = "";

      if (row.some(cell => cell !== "")) {
        rows.push(row);
      }

      row = [];
    }

    else {
      value += char;
    }
  }

  if (value !== "" || row.length > 0) {
    row.push(value.trim());

    if (row.some(cell => cell !== "")) {
      rows.push(row);
    }
  }

  return rows;
}


/* =========================================================
   CONVERT CSV TO BOOK OBJECTS
   ========================================================= */

function convertToBooks(csvText) {

  const rows = parseCSV(csvText);

  if (rows.length < 2) {
    return [];
  }

  const headers = rows[0].map(h =>
    h.trim().toLowerCase()
  );

  const getIndex = name =>
    headers.indexOf(name.toLowerCase());

  const bookNameIndex = getIndex("book name");
  const authorIndex   = getIndex("author");
  const imageIndex    = getIndex("image id");
  const buyIndex      = getIndex("buy link");
  const categoryIndex = getIndex("category");
  const languageIndex = getIndex("language");
  const displayIndex  = getIndex("display");
  const orderIndex    = getIndex("order");

  const books = [];

  for (let i = 1; i < rows.length; i++) {

    const row = rows[i];

    const getValue = index =>
      index >= 0 && row[index]
        ? row[index].trim()
        : "";

    const book = {

      name: getValue(bookNameIndex),

      author: getValue(authorIndex),

      imageId: getValue(imageIndex),

      buyLink: getValue(buyIndex),

      category: getValue(categoryIndex),

      language: getValue(languageIndex),

      display: getValue(displayIndex),

      order: parseInt(getValue(orderIndex)) || 999999
    };


    /*
      Show only:

      Display = Yes
      AND
      Image ID exists
    */

    if (
      book.name &&
      book.imageId &&
      book.display.toLowerCase() === "yes"
    ) {
      books.push(book);
    }
  }


  /* Sort using Order column */

  books.sort((a, b) => a.order - b.order);

  return books;
}


/* =========================================================
   GOOGLE DRIVE IMAGE URL
   ========================================================= */

function getImageURL(imageId) {

  return "https://drive.google.com/thumbnail?id=" +
         encodeURIComponent(imageId) +
         "&sz=w800";
}


/* =========================================================
   CREATE FILTER OPTIONS
   ========================================================= */

function createFilters() {

  const categoryFilter =
    document.getElementById("categoryFilter");

  const languageFilter =
    document.getElementById("languageFilter");


  const categories = [...new Set(
    allBooks
      .map(book => book.category)
      .filter(Boolean)
  )].sort();


  const languages = [...new Set(
    allBooks
      .map(book => book.language)
      .filter(Boolean)
  )].sort();


  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value = category;
    option.textContent = category;

    categoryFilter.appendChild(option);
  });


  languages.forEach(language => {

    const option =
      document.createElement("option");

    option.value = language;
    option.textContent = language;

    languageFilter.appendChild(option);
  });
}


/* =========================================================
   APPLY FILTERS
   ========================================================= */

function applyFilters() {

  const category =
    document.getElementById("categoryFilter").value;

  const language =
    document.getElementById("languageFilter").value;


  filteredBooks = allBooks.filter(book => {

    const categoryMatch =
      category === "all" ||
      book.category === category;

    const languageMatch =
      language === "all" ||
      book.language === language;

    return categoryMatch && languageMatch;
  });


  currentPage = 1;

  renderBooks();
}


/* =========================================================
   CREATE BOOK CARD
   ========================================================= */

function createBookCard(book) {

  const card =
    document.createElement("div");

  card.className = "book-card";


  /* Cover */

  const cover =
    document.createElement("div");

  cover.className = "cover-container";


  const img =
    document.createElement("img");

  img.src = getImageURL(book.imageId);

  img.alt = book.name;

  img.loading = "lazy";


  /*
    If Drive image cannot be loaded,
    remove the complete card.
  */

  img.onerror = function() {
    card.remove();
  };


  cover.appendChild(img);


  /* Details */

  const details =
    document.createElement("div");

  details.className = "book-details";


  const name =
    document.createElement("div");

  name.className = "book-name";

  name.textContent = book.name;


  details.appendChild(name);


  /* Author */

  if (book.author) {

    const author =
      document.createElement("div");

    author.className = "author";

    author.textContent =
      "by " + book.author;

    details.appendChild(author);
  }


  /* Tags */

  const meta =
    document.createElement("div");

  meta.className = "book-meta";


  if (book.category) {

    const category =
      document.createElement("span");

    category.className = "tag";

    category.textContent =
      book.category;

    meta.appendChild(category);
  }


  if (book.language) {

    const language =
      document.createElement("span");

    language.className = "tag";

    language.textContent =
      book.language;

    meta.appendChild(language);
  }


  if (meta.children.length > 0) {
    details.appendChild(meta);
  }


  /* Buy button */

  if (book.buyLink) {

    const buy =
      document.createElement("a");

    buy.className = "buy-button";

    buy.href = book.buyLink;

    buy.target = "_blank";

    buy.rel = "noopener noreferrer";

    buy.textContent = "BUY BOOK";

    details.appendChild(buy);
  }


  card.appendChild(cover);

  card.appendChild(details);

  return card;
}


/* =========================================================
   DISPLAY BOOKS
   ========================================================= */

function renderBooks() {

  const grid =
    document.getElementById("booksGrid");

  const pagination =
    document.getElementById("pagination");

  const count =
    document.getElementById("bookCount");


  grid.innerHTML = "";

  pagination.innerHTML = "";


  if (filteredBooks.length === 0) {

    grid.innerHTML =
      '<div class="status">No books found.</div>';

    count.textContent = "";

    return;
  }


  count.textContent =
    filteredBooks.length +
    (filteredBooks.length === 1
      ? " book"
      : " books");


  /* Calculate page */

  const totalPages =
    Math.ceil(
      filteredBooks.length /
      BOOKS_PER_PAGE
    );


  if (currentPage > totalPages) {
    currentPage = totalPages;
  }


  const start =
    (currentPage - 1) *
    BOOKS_PER_PAGE;

  const end =
    start + BOOKS_PER_PAGE;


  const pageBooks =
    filteredBooks.slice(start, end);


  pageBooks.forEach(book => {

    grid.appendChild(
      createBookCard(book)
    );

  });


  createPagination(totalPages);
}


/* =========================================================
   PAGINATION
   ========================================================= */

function createPagination(totalPages) {

  const pagination =
    document.getElementById("pagination");


  if (totalPages <= 1) {
    return;
  }


  /* Previous */

  const previous =
    document.createElement("button");

  previous.className = "page-button";

  previous.textContent = "‹";

  previous.disabled =
    currentPage === 1;

  previous.onclick = function() {

    if (currentPage > 1) {

      currentPage--;

      renderBooks();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  };

  pagination.appendChild(previous);


  /* Page numbers */

  for (let i = 1; i <= totalPages; i++) {

    const button =
      document.createElement("button");

    button.className = "page-button";

    button.textContent = i;


    if (i === currentPage) {
      button.classList.add("active");
    }


    button.onclick = function() {

      currentPage = i;

      renderBooks();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };


    pagination.appendChild(button);
  }


  /* Next */

  const next =
    document.createElement("button");

  next.className = "page-button";

  next.textContent = "›";

  next.disabled =
    currentPage === totalPages;

  next.onclick = function() {

    if (currentPage < totalPages) {

      currentPage++;

      renderBooks();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  };

  pagination.appendChild(next);
}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadBooks() {

  const grid =
    document.getElementById("booksGrid");

  try {

    const response =
      await fetch(CSV_URL, {
        cache: "no-store"
      });


    if (!response.ok) {
      throw new Error(
        "Unable to load spreadsheet"
      );
    }


    const csvText =
      await response.text();


    allBooks =
      convertToBooks(csvText);


    filteredBooks =
      [...allBooks];


    createFilters();

    renderBooks();


  } catch (error) {

    console.error(error);

    grid.innerHTML =
      '<div class="status">' +
      'Unable to load the books at the moment.' +
      '<br>Please try again later.' +
      '</div>';
  }
}


/* =========================================================
   FILTER EVENTS
   ========================================================= */

document
  .getElementById("categoryFilter")
  .addEventListener(
    "change",
    applyFilters
  );


document
  .getElementById("languageFilter")
  .addEventListener(
    "change",
    applyFilters
  );


/* =========================================================
   START
   ========================================================= */

loadBooks();

</script>

</body>
</html>
