<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Think Lab - Books on Thinking</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: Arial, "Noto Sans Tamil", sans-serif;
    background: url('bg.webp') no-repeat center center fixed;
    background-size: cover;
    color: #1d2940;
  }

  .container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 18px 40px;
    min-height: 700px;
  }

  /* Sticky Header */
  .header {
    position: sticky;
    top: 0;
    z-index: 2000;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    margin-bottom: 22px;
    background: transparent;
    border-bottom: 1px solid rgba(225, 228, 232, 0.6);
  }

  .brand-logo {
    height: 48px;
    width: auto;
    display: block;
    cursor: pointer;
    background: transparent;
  }

  .hamburger-btn {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    width: 32px;
    height: 26px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 1001;
  }

  .hamburger-btn .bar {
    width: 100%;
    height: 3px;
    background-color: #1d2940;
    border-radius: 4px;
    transition: all 0.3s ease;
    pointer-events: none;
  }

  /* SLIDE-OUT NAVIGATION DRAWER */
  .nav-drawer {
    position: fixed;
    top: 0;
    right: -320px;
    width: 280px;
    height: 100vh;
    background: #ffffff;
    box-shadow: -4px 0 20px rgba(0, 0, 0, 0.2);
    z-index: 2000;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
  }

  .nav-drawer.open {
    right: 0 !important;
  }

  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
    color: #1d2940;
    padding-bottom: 15px;
    border-bottom: 1px solid #e1e4e8;
  }

  .close-drawer-btn {
    background: #f0f2f5;
    border: none;
    font-size: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    color: #1d2940;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .close-drawer-btn:hover {
    background: #e2e8f0;
  }

  .drawer-links {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 20px;
  }

  .drawer-links a {
    text-align: left;
    text-decoration: none;
    color: #1d2940;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background 0.2s ease;
    font-family: Arial, Helvetica, sans-serif;
    width: 100%;
    display: block;
  }

  .drawer-links a:hover {
    background: #f0f2f5;
  }

  .nav-divider {
    border: 0;
    border-top: 1px solid #e1e4e8;
    margin: 8px 0;
  }

  .nav-btn-link {
    text-align: center !important;
    margin-top: 4px;
    display: block;
  }

  .login-btn {
    background: #f0f2f5 !important;
    border: 1px solid #d0d5dd !important;
  }

  .join-btn {
    background: #1d2940 !important;
    color: #ffffff !important;
  }

  .join-btn:hover {
    background: #2d3d5b !important;
  }

  .nav-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.4);
    z-index: 1500;
  }

  .nav-backdrop.active {
    display: block !important;
  }

  /* BACK TO HOME BUTTON */
  .back-to-home-btn {
    display: inline-block;
    margin-bottom: 20px;
    padding: 8px 16px;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9);
    color: #1d2940;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .back-to-home-btn:hover {
    background: #ffffff;
    border-color: #1d2940;
  }

  /* ---------- HEADER ---------- */

  .page-header {
    text-align: center;
    margin-bottom: 25px;
  }

  .page-header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #1d2940;
  }

  .page-header .subtitle {
    margin-top: 8px;
    font-size: 15px;
    color: #555;
  }

  /* ---------- FILTERS ---------- */

  .filters {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
  }

  .filters select {
    min-width: 170px;
    padding: 10px 35px 10px 12px;
    border: 1px solid #d0d5dd;
    border-radius: 9px;
    background: white;
    color: #222;
    font-size: 16px;
    font-family: Arial, "Noto Sans Tamil", sans-serif;
    cursor: pointer;
    outline: none;
  }

  .filters select:focus {
    border-color: #1d2940;
  }

  /* ---------- BOOK GRID ---------- */

  .books-grid {
    display: grid;
    grid-template-columns: 280px;
    justify-content: center;
    gap: 22px;
  }

  /* ---------- BOOK CARD ---------- */

  .book-card {
    background: rgba(255, 255, 255, 0.97);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e5e9ef;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
  }

  .book-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
  }

  /* ---------- COVER ---------- */

  .cover-container {
    width: 100%;
    height: 285px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .cover-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 12px;
  }

  /* ---------- DETAILS ---------- */

  .book-details {
    padding: 15px 15px 16px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    background: #ffffff;
  }

  .book-name {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    color: #1d2940;
  }

  .author {
    font-size: 13px;
    color: #667085;
    margin-bottom: 10px;
  }

  .book-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 15px;
  }

  .tag {
    display: inline-block;
    background: #f1f5f9;
    color: #475467;
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 20px;
  }

  /* ---------- BUY BUTTON ---------- */

  .buy-button {
    display: block;
    margin-top: auto;
    padding: 10px 12px;
    text-align: center;
    text-decoration: none;
    border-radius: 7px;
    background: #1a73e8;
    color: white;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.2s ease;
  }

  .buy-button:hover {
    background: #1557b0;
  }

  /* ---------- PAGINATION ---------- */

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
  }

  .page-button {
    min-width: 40px;
    height: 36px;
    border: 1px solid #d5dbe3;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1d2940;
  }

  .page-button:hover {
    background: #ffffff;
    border-color: #1d2940;
  }

  .page-button:disabled {
    opacity: 0.45;
    cursor: default;
  }

  .page-indicator {
    font-size: 14px;
    color: #1d2940;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.9);
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid #d5dbe3;
  }

  /* ---------- STATUS ---------- */

  .status {
    text-align: center;
    padding: 30px 10px;
    color: #555;
    font-size: 15px;
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width: 600px) {
    .header { padding: 8px 14px; }
    .brand-logo { height: 36px; }

    .container {
      padding: 8px 12px 30px;
    }

    .cover-container {
      height: 250px;
    }

    .book-details {
      padding: 12px;
    }

    .book-name {
      font-size: 15px;
    }
  }

  @media (max-width: 450px) {
    .cover-container {
      height: 330px;
    }
  }
</style>
</head>

<body>

<div class="container">

  <!-- Sticky Top Header -->
  <header class="header">
    <a href="index.html#home" class="brand">
      <img src="logo.webp" alt="Think Lab Logo" class="brand-logo">
    </a>

    <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle navigation menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <div class="nav-drawer" id="navDrawer">
      <div class="drawer-header">
        <span>Menu</span>
        <button type="button" class="close-drawer-btn" id="closeDrawerBtn">✕</button>
      </div>

      <nav class="drawer-links">
        <a href="index.html#home">Home</a>
        <a href="index.html#benefits">Your Benefits</a>
        <a href="index.html#impact">Our Impact</a>

        <hr class="nav-divider">

        <a href="sample_stories.html">Sample Stories</a>
        <a href="books.html" style="background:#f0f2f5;">Books on Thinking</a>
        <a href="https://wa.me/919791917408" target="_blank" rel="noopener noreferrer">Contact Us</a>

        <hr class="nav-divider">

        <a href="https://member.thinkingskill.in" target="_blank" class="nav-btn-link login-btn">Member Login</a>
        <a href="index.html#register" class="nav-btn-link join-btn">Join Think Lab</a>
      </nav>
    </div>
  </header>

  <div class="nav-backdrop" id="navBackdrop"></div>

  <!-- Back to Home Button -->
  <a href="index.html#home" class="back-to-home-btn">← Back to Home</a>

  <div class="page-header">
    <h1>Books on Thinking</h1>
<!--    <div class="subtitle">
      Books on Thinking
    </div> -->
  </div>

  <div class="filters">
    <select id="languageFilter">
      <option value="all">All Languages</option>
    </select>
  </div>

  <div id="pagination" class="pagination"></div>

  <div id="booksGrid" class="books-grid">
    <div class="status">Loading books...</div>
  </div>

</div>


<script>
document.addEventListener('DOMContentLoaded', function() {

  /* =========================================================
     NAVIGATION DRAWER TOGGLE
     ========================================================= */

  const navDrawer = document.getElementById('navDrawer');
  const navBackdrop = document.getElementById('navBackdrop');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const closeDrawerBtn = document.getElementById('closeDrawerBtn');

  function openNavDrawer() {
    if (navDrawer) navDrawer.classList.add('open');
    if (navBackdrop) navBackdrop.classList.add('active');
  }

  function closeNavDrawer() {
    if (navDrawer) navDrawer.classList.remove('open');
    if (navBackdrop) navBackdrop.classList.remove('active');
  }

  if (hamburgerBtn) hamburgerBtn.addEventListener('click', openNavDrawer);
  if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', closeNavDrawer);
  if (navBackdrop) navBackdrop.addEventListener('click', closeNavDrawer);


  /* =========================================================
     THINK LAB BOOKS
     Google Sheets Published CSV
     ========================================================= */

  const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vSRrWjgpCdgZdXvw8wCH27chZROO882LQqipfpa01vXuIuEEe8AbaSunCUvA5xLgoY1rHR9Jtw2nvdw/pub?gid=0&single=true&output=csv";


  /* Number of books shown on each page */
  const BOOKS_PER_PAGE = 1;


  /* Data */
  let allBooks = [];
  let filteredBooks = [];
  let currentPage = 1;


  /* =========================================================
     CSV PARSER
     ========================================================= */

  function parseCSV(text) {

    const rows = [];
    let row = [];
    let value = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

      const char = text[i];
      const next = text[i + 1];

      if (char === '"' && insideQuotes && next === '"') {
        value += '"';
        i++;
      }

      else if (char === '"') {
        insideQuotes = !insideQuotes;
      }

      else if (char === ',' && !insideQuotes) {
        row.push(value.trim());
        value = "";
      }

      else if ((char === '\n' || char === '\r') && !insideQuotes) {

        if (char === '\r' && next === '\n') {
          i++;
        }

        row.push(value.trim());
        value = "";

        if (row.some(cell => cell !== "")) {
          rows.push(row);
        }

        row = [];
      }

      else {
        value += char;
      }
    }

    if (value !== "" || row.length > 0) {
      row.push(value.trim());

      if (row.some(cell => cell !== "")) {
        rows.push(row);
      }
    }

    return rows;
  }


  /* =========================================================
     CONVERT CSV TO BOOK OBJECTS
     ========================================================= */

  function convertToBooks(csvText) {

    const rows = parseCSV(csvText);

    if (rows.length < 2) {
      return [];
    }

    const headers = rows[0].map(h =>
      h.trim().toLowerCase()
    );

    const getIndex = name =>
      headers.indexOf(name.toLowerCase());

    const bookNameIndex = getIndex("book name");
    const authorIndex   = getIndex("author");
    const imageIndex    = getIndex("image id");
    const buyIndex      = getIndex("buy link");
    const categoryIndex = getIndex("category");
    const languageIndex = getIndex("language");
    const displayIndex  = getIndex("display");
    const orderIndex    = getIndex("order");

    const books = [];

    for (let i = 1; i < rows.length; i++) {

      const row = rows[i];

      const getValue = index =>
        index >= 0 && row[index]
          ? row[index].trim()
          : "";

      const book = {
        name: getValue(bookNameIndex),
        author: getValue(authorIndex),
        imageId: getValue(imageIndex),
        buyLink: getValue(buyIndex),
        category: getValue(categoryIndex),
        language: getValue(languageIndex),
        display: getValue(displayIndex),
        order: parseInt(getValue(orderIndex)) || 999999
      };

      if (
        book.name &&
        book.imageId &&
        book.display.toLowerCase() === "yes"
      ) {
        books.push(book);
      }
    }

    books.sort((a, b) => a.order - b.order);

    return books;
  }


  /* =========================================================
     GOOGLE DRIVE IMAGE URL
     ========================================================= */

  function getImageURL(imageId) {
    return "https://drive.google.com/thumbnail?id=" +
           encodeURIComponent(imageId) +
           "&sz=w800";
  }


  /* =========================================================
     CREATE FILTER OPTIONS
     ========================================================= */

  function createFilters() {
    const languageFilter = document.getElementById("languageFilter");

    const languages = [...new Set(
      allBooks
        .map(book => book.language)
        .filter(Boolean)
    )].sort();

    languages.forEach(language => {
      const option = document.createElement("option");
      option.value = language;
      option.textContent = language;
      languageFilter.appendChild(option);
    });
  }


  /* =========================================================
     APPLY FILTERS
     ========================================================= */

  function applyFilters() {
    const language = document.getElementById("languageFilter").value;

    filteredBooks = allBooks.filter(book => {
      return language === "all" || book.language === language;
    });

    currentPage = 1;
    renderBooks();
  }


  /* =========================================================
     CREATE BOOK CARD
     ========================================================= */

  function createBookCard(book) {

    const card = document.createElement("div");
    card.className = "book-card";

    /* Cover */
    const cover = document.createElement("div");
    cover.className = "cover-container";

    const img = document.createElement("img");
    img.src = getImageURL(book.imageId);
    img.alt = book.name;
    img.loading = "lazy";

    img.onerror = function() {
      card.remove();
    };

    cover.appendChild(img);

    /* Details */
    const details = document.createElement("div");
    details.className = "book-details";

    const name = document.createElement("div");
    name.className = "book-name";
    name.textContent = book.name;

    details.appendChild(name);

    /* Author */
    if (book.author) {
      const author = document.createElement("div");
      author.className = "author";
      author.textContent = "by " + book.author;
      details.appendChild(author);
    }

    /* Tags */
    const meta = document.createElement("div");
    meta.className = "book-meta";

    if (book.category) {
      const category = document.createElement("span");
      category.className = "tag";
      category.textContent = book.category;
      meta.appendChild(category);
    }

    if (book.language) {
      const language = document.createElement("span");
      language.className = "tag";
      language.textContent = book.language;
      meta.appendChild(language);
    }

    if (meta.children.length > 0) {
      details.appendChild(meta);
    }

    /* Buy button */
    if (book.buyLink) {
      const buy = document.createElement("a");
      buy.className = "buy-button";
      buy.href = book.buyLink;
      buy.target = "_blank";
      buy.rel = "noopener noreferrer";
      buy.textContent = "BUY BOOK";
      details.appendChild(buy);
    }

    card.appendChild(cover);
    card.appendChild(details);

    return card;
  }


  /* =========================================================
     DISPLAY BOOKS
     ========================================================= */

  function renderBooks() {

    const grid = document.getElementById("booksGrid");
    const pagination = document.getElementById("pagination");

    grid.innerHTML = "";
    pagination.innerHTML = "";

    if (filteredBooks.length === 0) {
      grid.innerHTML = '<div class="status">No books found.</div>';
      return;
    }

    const totalPages = Math.ceil(filteredBooks.length / BOOKS_PER_PAGE);

    if (currentPage > totalPages) {
      currentPage = totalPages;
    }

    const start = (currentPage - 1) * BOOKS_PER_PAGE;
    const end = start + BOOKS_PER_PAGE;
    const pageBooks = filteredBooks.slice(start, end);

    pageBooks.forEach(book => {
      grid.appendChild(createBookCard(book));
    });

    createPagination(totalPages);
  }


  /* =========================================================
     PAGINATION (ARROWS ONLY)
     ========================================================= */

  function createPagination(totalPages) {

    const pagination = document.getElementById("pagination");

    if (totalPages <= 1) {
      return;
    }

    /* Previous Arrow */
    const previous = document.createElement("button");
    previous.className = "page-button";
    previous.textContent = "‹";
    previous.disabled = currentPage === 1;

    previous.onclick = function() {
      if (currentPage > 1) {
        currentPage--;
        renderBooks();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    };

    pagination.appendChild(previous);

    /* Page Indicator (e.g. 1 / 9) */
    const indicator = document.createElement("span");
    indicator.className = "page-indicator";
    indicator.textContent = currentPage + " / " + totalPages;
    pagination.appendChild(indicator);

    /* Next Arrow */
    const next = document.createElement("button");
    next.className = "page-button";
    next.textContent = "›";
    next.disabled = currentPage === totalPages;

    next.onclick = function() {
      if (currentPage < totalPages) {
        currentPage++;
        renderBooks();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    };

    pagination.appendChild(next);
  }


  /* =========================================================
     LOAD DATA
     ========================================================= */

  async function loadBooks() {

    const grid = document.getElementById("booksGrid");

    try {
      const response = await fetch(CSV_URL, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Unable to load spreadsheet");
      }

      const csvText = await response.text();

      allBooks = convertToBooks(csvText);
      filteredBooks = [...allBooks];

      createFilters();
      renderBooks();

    } catch (error) {
      console.error(error);
      grid.innerHTML =
        '<div class="status">' +
        'Unable to load the books at the moment.' +
        '<br>Please try again later.' +
        '</div>';
    }
  }


  /* =========================================================
     FILTER EVENTS
     ========================================================= */

  document
    .getElementById("languageFilter")
    .addEventListener("change", applyFilters);


  /* =========================================================
     START
     ========================================================= */

  loadBooks();

});
</script>

</body>
</html>
