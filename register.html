<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Event Registration | Thinkers Hub</title>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #d94b15;
      --primary-hover: #b83c0e;
      --bg: #ffffff;
      --surface: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: #f1f5f9;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }

    body { display: flex; justify-content: center; align-items: center; }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    /* Top Bar Header */
    .top-bar {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #d94b15 0%, #b83c0e 100%);
      color: #ffffff;
      z-index: 10;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(217, 75, 21, 0.25);
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .back-btn:hover { opacity: 0.85; }

    .action-icons { display: flex; align-items: center; gap: 16px; }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover { opacity: 0.85; }
    .icon-btn.active-heart { color: #fecdd3; fill: #fecdd3; }
    .icon-btn.active-heart svg { fill: #fecdd3; stroke: #fecdd3; }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 110px;
    }

    .hero-image-container {
      width: 100%;
      height: 240px;
      background: #f8fafc;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }

    .hero-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    .main-content { padding: 24px 20px; }

    .event-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text-main);
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .meta-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: #334155;
      font-size: 15px;
      font-weight: 500;
    }

    .meta-item i { color: var(--text-muted); margin-top: 2px; flex-shrink: 0; }

    /* Organizer Card */
    .organizer-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 16px;
      margin-bottom: 20px;
    }

    .organizer-info { display: flex; align-items: center; gap: 12px; }

    .organizer-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #e2e8f0;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .organizer-details { display: flex; flex-direction: column; }
    .organizer-by { font-size: 14px; color: var(--text-muted); font-weight: 500; line-height: 1.2; }
    .organizer-name { font-weight: 700; color: var(--text-main); }
    .organizer-subtext { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .visit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background-color: #ffffff;
      color: var(--text-main);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .visit-btn:hover { border-color: var(--primary); color: var(--primary); background-color: #fff7ed; }

    .divider { height: 1px; background-color: var(--border); margin: 24px 0; }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: var(--text-main); }
    .overview-text { color: #475569; font-size: 15px; line-height: 1.6; }

    /* Bottom Reservation Bar */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 84px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 -6px 20px rgba(15, 23, 42, 0.25);
      z-index: 30;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .batch-input-wrapper { flex: 1; display: flex; flex-direction: column; gap: 4px; }

    .batch-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #334155;
      background-color: #1e293b;
      color: #ffffff;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }

    .batch-input::placeholder { color: #94a3b8; }
    .batch-input:focus { border-color: var(--primary); background-color: #0f172a; }
    .batch-input.is-invalid { border-color: #ef4444; }
    .batch-input.is-valid { border-color: #22c55e; }

    .btn-reserve {
      background: linear-gradient(135deg, #d94b15 0%, #b83c0e 100%);
      color: #ffffff;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(217, 75, 21, 0.35);
    }

    .btn-reserve:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(217, 75, 21, 0.45);
    }

    .btn-reserve:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal-card {
      width: 100%;
      background: #ffffff;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open .modal-card { transform: translateY(0); }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 18px; font-weight: 700; }
    .close-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    .form-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
    .form-input:focus { border-color: var(--primary); }
    .submit-btn { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }

    .toast {
      position: absolute;
      top: 66px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #0f172a; color: #fff;
      padding: 8px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: all 0.3s ease; z-index: 60;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="toast" id="toast">Link copied to clipboard!</div>

    <!-- Header -->
    <header class="top-bar">
      <a href="https://www.thinkingskill.in" class="back-btn">
        <i data-lucide="arrow-left" size="18"></i>
        <span>Back to Thinker Hub</span>
      </a>

      <div class="action-icons">
        <button class="icon-btn" id="shareBtn" title="Share Event">
          <i data-lucide="share-2" size="20"></i>
        </button>
        <button class="icon-btn" id="heartBtn" title="Favorite">
          <i data-lucide="heart" size="20"></i>
        </button>
      </div>
    </header>

    <!-- Scrollable Middle Content -->
    <div class="content-scroll">
      <div class="hero-image-container">
        <img 
          id="heroBanner"
          src="https://lh3.googleusercontent.com/d/18PQ4nYxcX4mM-_5QIPs_6gZFC5KFWieU" 
          alt="Course Banner" 
          class="hero-image"
        />
      </div>

      <main class="main-content">
        <h1 class="event-title" id="courseTitle">Google Flow for Beginners</h1>

        <div class="meta-list">
          <div class="meta-item">
            <i data-lucide="map-pin" size="18"></i>
            <span id="eventLink">Online Event (Free)</span>
          </div>
          <div class="meta-item">
            <i data-lucide="calendar" size="18"></i>
            <span id="eventDateTime">Sat, Nov 21st • 10-11am IST</span>
          </div>
        </div>

        <!-- Organizer Card -->
        <div class="organizer-card">
          <div class="organizer-info">
            <img 
              id="organizerLogo"
              src="https://lh3.googleusercontent.com/d/1IBGBjphVdRvG1VkRRVxAXC4WrBj6egAg" 
              alt="Thinkers Hub Logo" 
              class="organizer-logo"
            />
            <div class="organizer-details">
              <span class="organizer-by">by <span class="organizer-name">Thinkers Hub</span></span>
              <span class="organizer-subtext" id="learnersCount">0 learners joined</span>
            </div>
          </div>
          <a href="https://www.thinkingskill.in" target="_blank" class="visit-btn">Visit</a>
        </div>

        <div class="divider"></div>

        <section>
          <h2 class="section-title">Overview</h2>
          <p class="overview-text" id="courseOverview">
            Creating Images and Short Videos Using Google Flow: Ensuring Character and Voice Consistency
          </p>
        </section>
      </main>
    </div>

    <!-- Bottom Reservation Bar -->
    <footer class="bottom-bar">
      <div class="batch-input-wrapper">
        <input 
          type="text" 
          id="batchCodeInput" 
          class="batch-input" 
          placeholder="Enter Batch Code" 
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button class="btn-reserve" id="openModalBtn" disabled>Register now</button>
    </footer>

    <!-- Registration Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">Register Now</h3>
          <button class="close-btn" id="closeModalBtn">
            <i data-lucide="x" size="20"></i>
          </button>
        </div>
        <form id="bookingForm">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="form-input" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="john@example.com" required />
          </div>
          <button type="submit" class="submit-btn">Confirm Registration</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // DOM Elements
    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const bookingForm = document.getElementById('bookingForm');
    const heartBtn = document.getElementById('heartBtn');
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');
    const batchCodeInput = document.getElementById('batchCodeInput');

    let VALID_BATCH_CODE = "TL211126";

    // PUBLISHED PUBLIC CSV ENDPOINTS
    const MASTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQa1DwC7x54wuxZJoYFBhCt8SzHBpkWuqyH7XQIcMzdjj6_VXBl1DOJne8oaX4jcujrrpTJlvj_E9qM/pub?gid=1114785347&single=true&output=csv";
    const PUBLIC_FEED_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQa1DwC7x54wuxZJoYFBhCt8SzHBpkWuqyH7XQIcMzdjj6_VXBl1DOJne8oaX4jcujrrpTJlvj_E9qM/pub?gid=1149121719&single=true&output=csv";

    // UPDATED GOOGLE FORM URL & PRE-FILLED ENTRY IDs
    const GOOGLE_FORM_ACTION_URL = "https://docs.google.com/forms/d/e/1FAIpQLScliz0hmsuSd30UhjTuowFlcUVXcKO7oDgsGRyKo7xzL-YYjw/formResponse";
    const NAME_ENTRY_ID = "entry.1284435015";       
    const EMAIL_ENTRY_ID = "entry.1988767158";      
    const BATCH_CODE_ENTRY_ID = "entry.2046668482"; 

    function parseCSV(text) {
      return text.split('\n')
        .map(row => row.trim())
        .filter(row => row.length > 0)
        .map(row => row.split(',').map(cell => cell.replace(/^"|"$/g, '').trim()));
    }

    // Load Public Feed CSV and compute actual learner count (ignoring hyphens/headers)
    async function loadPublicFeed() {
      try {
        const res = await fetch(PUBLIC_FEED_CSV_URL);
        const csvText = await res.text();
        const rows = parseCSV(csvText);

        let learnerCount = 0;

        // If cell B2 contains a numeric count directly, use it
        if (rows.length > 1 && !isNaN(parseInt(rows[1][1]))) {
          learnerCount = parseInt(rows[1][1]);
        } else {
          // Otherwise count valid rows in column A (skipping header & invalid cells)
          const validLearners = rows.slice(1).filter(r => r[0] && r[0] !== '-' && r[0] !== '');
          learnerCount = validLearners.length;
        }

        document.getElementById('learnersCount').textContent = `${learnerCount} learners joined`;
      } catch (e) {
        console.warn("Could not load Public Feed CSV:", e);
      }
    }

    // Load Master Courses CSV
    async function loadMasterCourses() {
      try {
        const res = await fetch(MASTER_CSV_URL);
        const csvText = await res.text();
        const rows = parseCSV(csvText);
        
        if (rows.length > 1) {
          const row = rows[1];
          VALID_BATCH_CODE = row[0] || VALID_BATCH_CODE;
          document.getElementById('courseTitle').textContent = row[1] || "Google Flow for Beginners";
          document.getElementById('eventDateTime').textContent = `${row[2]} • ${row[3]}`;
          document.getElementById('eventLink').textContent = row[4] || "Online Event (Free)";
          document.getElementById('courseOverview').textContent = row[7] || "";
          
          if (row[8]) document.getElementById('heroBanner').src = `https://lh3.googleusercontent.com/d/${row[8]}`;
          if (row[9]) document.getElementById('organizerLogo').src = `https://lh3.googleusercontent.com/d/${row[9]}`;
        }
      } catch (e) {
        console.warn("Could not load Master Courses CSV:", e);
      }
    }

    loadMasterCourses();
    loadPublicFeed();

    // Batch Code Input Listener
    batchCodeInput.addEventListener('input', () => {
      const enteredCode = batchCodeInput.value.trim().toUpperCase();
      if (enteredCode === VALID_BATCH_CODE) {
        openModalBtn.disabled = false;
        batchCodeInput.classList.remove('is-invalid');
        batchCodeInput.classList.add('is-valid');
      } else {
        openModalBtn.disabled = true;
        batchCodeInput.classList.remove('is-valid');
        if (enteredCode.length >= VALID_BATCH_CODE.length) {
          batchCodeInput.classList.add('is-invalid');
        } else {
          batchCodeInput.classList.remove('is-invalid');
        }
      }
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    openModalBtn.addEventListener('click', () => {
      if (!openModalBtn.disabled) modalOverlay.classList.add('open');
    });
    
    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('open'));
    
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('open');
    });

    bookingForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const nameValue = document.getElementById('name').value.trim();
      const emailValue = document.getElementById('email').value.trim();
      const batchCodeValue = batchCodeInput.value.trim().toUpperCase();

      const formData = new FormData();
      formData.append(NAME_ENTRY_ID, nameValue);
      formData.append(EMAIL_ENTRY_ID, emailValue);
      formData.append(BATCH_CODE_ENTRY_ID, batchCodeValue);

      const submitBtn = bookingForm.querySelector('.submit-btn');
      submitBtn.textContent = 'Submitting...';
      submitBtn.disabled = true;

      fetch(GOOGLE_FORM_ACTION_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      })
      .then(() => {
        alert('Registration successful! Check your email for event access instructions.');
        modalOverlay.classList.remove('open');
        bookingForm.reset();
        setTimeout(loadPublicFeed, 2500);
      })
      .catch((error) => {
        console.error('Submission error:', error);
        alert('Registration failed. Please try again.');
      })
      .finally(() => {
        submitBtn.textContent = 'Confirm Registration';
        submitBtn.disabled = false;
      });
    });

    heartBtn.addEventListener('click', () => {
      heartBtn.classList.toggle('active-heart');
      lucide.createIcons();
    });

    shareBtn.addEventListener('click', async () => {
      const shareData = {
        title: document.getElementById('courseTitle').textContent,
        text: document.getElementById('courseOverview').textContent,
        url: window.location.href,
      };

      if (navigator.share) {
        try { await navigator.share(shareData); } catch (err) {}
      } else {
        navigator.clipboard.writeText(window.location.href);
        showToast('Event link copied to clipboard!');
      }
    });
  </script>
</body>
</html>
