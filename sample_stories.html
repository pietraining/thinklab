<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Think Lab - Sample Stories</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, "Noto Sans Tamil", sans-serif;
    background: url('bg.webp') no-repeat center center fixed;
    background-size: cover;
    color: #1d2940;
}

/* =====================================================
   MAIN CONTAINER & STICKY HEADER
===================================================== */

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 18px 40px;
    min-height: 700px;
}

/* Sticky Header */
.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    margin-bottom: 22px;
    background: transparent;
    border-bottom: 1px solid rgba(225, 228, 232, 0.4);
}

.brand-logo {
    height: 48px;
    width: auto;
    display: block;
    cursor: pointer;
    background: transparent;
}

/* 3-Line Hamburger Button */
.hamburger-btn {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    width: 32px;
    height: 26px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 1001;
}

.hamburger-btn .bar {
    width: 100%;
    height: 3px;
    background-color: #1d2940;
    border-radius: 4px;
    transition: all 0.3s ease;
    pointer-events: none;
}

/* =====================================================
   SLIDE-OUT NAVIGATION DRAWER
===================================================== */
.nav-drawer {
    position: fixed;
    top: 0;
    right: -320px;
    width: 280px;
    height: 100vh;
    background: #ffffff;
    box-shadow: -4px 0 20px rgba(0, 0, 0, 0.2);
    z-index: 2000;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
}

.nav-drawer.open {
    right: 0 !important;
}

.drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
    color: #1d2940;
    padding-bottom: 15px;
    border-bottom: 1px solid #e1e4e8;
}

.close-drawer-btn {
    background: #f0f2f5;
    border: none;
    font-size: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    color: #1d2940;
    display: flex;
    align-items: center;
    justify-content: center;
}

.close-drawer-btn:hover {
    background: #e2e8f0;
}

.drawer-links {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 20px;
}

.drawer-links a {
    text-align: left;
    text-decoration: none;
    color: #1d2940;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background 0.2s ease;
    font-family: Arial, Helvetica, sans-serif;
    width: 100%;
    display: block;
}

.drawer-links a:hover {
    background: #f0f2f5;
}

.nav-divider {
    border: 0;
    border-top: 1px solid #e1e4e8;
    margin: 8px 0;
}

.nav-btn-link {
    text-align: center !important;
    margin-top: 4px;
    display: block;
}

.login-btn {
    background: #f0f2f5 !important;
    border: 1px solid #d0d5dd !important;
}

.join-btn {
    background: #1d2940 !important;
    color: #ffffff !important;
}

.join-btn:hover {
    background: #2d3d5b !important;
}

/* Backdrop Overlay */
.nav-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.4);
    z-index: 1500;
}

.nav-backdrop.active {
    display: block !important;
}

/* =====================================================
   PAGE CONTENT & SELECTORS
===================================================== */

.page-title {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin: 10px 0 8px;
    color: #1d2940;
}

.subtitle {
    text-align: center;
    font-size: 15px;
    color: #555;
    line-height: 1.5;
    margin-bottom: 20px;
}

.selector {
    margin-bottom: 14px;
}

.selector label {
    display: block;
    margin-bottom: 6px;
    font-size: 15px;
    font-weight: 600;
    color: #1d2940;
}

.selector select {
    width: 100%;
    min-height: 44px;
    padding: 10px 14px;
    font-size: 16px;
    font-family: Arial, "Noto Sans Tamil", sans-serif;
    color: #222;
    background: white;
    border: 1px solid #d0d5dd;
    border-radius: 9px;
    outline: none;
    cursor: pointer;
}

.selector select:focus {
    border-color: #1d2940;
}

.selector select:disabled {
    background: #f3f4f6;
    color: #999;
    cursor: not-allowed;
}

/* =====================================================
   MESSAGE
===================================================== */

#message {
    text-align: center;
    padding: 15px 8px;
    font-size: 15px;
    color: #555;
}

#welcomeImage {
    width: 100%;
    text-align: center;
    margin: 20px 0;
}

#welcomeImage img {
    width: 100%;
    max-width: 700px;
    max-height: 450px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    border-radius: 12px;
}

/* =====================================================
   CONTENT
===================================================== */

#content {
    display: none;
    margin-top: 18px;
    padding: 20px;
    background: rgba(255,255,255,0.97);
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    overflow: hidden;
}

/* =====================================================
   ACTIVITY HEADING
===================================================== */

.activity-heading {
    margin-top: 8px;
    margin-bottom: 18px;
    padding: 11px 14px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: #1d2940;
    background: #f0f2f5;
    border-radius: 10px;
    border-left: 4px solid #1d2940;
}

/* =====================================================
   STORY IMAGE
===================================================== */

.story-image {
    width: 100%;
    max-width: 700px;
    max-height: 450px;
    object-fit: contain;
    display: block;
    margin: 0 auto 20px;
    border-radius: 12px;
}

/* =====================================================
   STORY TITLE
===================================================== */

.story-title {
    font-size: 26px;
    line-height: 1.4;
    font-weight: 700;
    text-align: center;
    margin: 10px 0 22px;
    color: #1d2940;
}

/* =====================================================
   SECTION
===================================================== */

.section {
    margin-top: 20px;
}

.section-title {
    font-size: 18px;
    font-weight: 700;
    color: #1d2940;
    margin-bottom: 7px;
}

.section-text {
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-line;
    overflow-wrap: break-word;
}

.section-text-remarks {
    text-align: center;
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-line;
    overflow-wrap: break-word;
}

/* =====================================================
   VALUE
===================================================== */

.value-box {
    margin-top: 22px;
    padding: 15px;
    background: #f0f2f5;
    border-left: 4px solid #1d2940;
    border-radius: 10px;
}

/* =====================================================
   PIE CHALLENGE
===================================================== */

.challenge-box {
    margin-top: 22px;
    padding: 16px;
    background: #fff7ed;
    border-left: 4px solid #f97316;
    border-radius: 10px;
}

.challenge-title {
    font-size: 19px;
    font-weight: 700;
    color: #c2410c;
    margin-bottom: 8px;
}

/* =====================================================
   ACTIVITY SEPARATOR
===================================================== */

.activity-separator {
    height: 1px;
    margin: 38px 0 10px;
    background: linear-gradient(to right, transparent, #d0d5dd, transparent);
}

/* =====================================================
   YOUTUBE
===================================================== */

.video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 14px;
    background: #000;
    margin-bottom: 22px;
}

.video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {
    .header { padding: 8px 14px; }
    .brand-logo { height: 36px; }

    .container {
        padding: 8px 12px 30px;
        min-height: 650px;
    }

    .selector select {
        font-size: 15px;
    }

    #content {
        padding: 15px;
    }

    .story-title {
        font-size: 21px;
    }

    .activity-heading {
        font-size: 18px;
        margin-top: 6px;
        margin-bottom: 15px;
    }

    .section-text {
        font-size: 15px;
        line-height: 1.7;
    }
}

</style>

</head>

<body>

<div class="container">

    <!-- Sticky Top Header -->
    <header class="header">
        <!-- Brand Logo on Left -->
        <a href="index.html" class="brand">
            <img src="logo.webp" alt="Think Lab Logo" class="brand-logo">
        </a>

        <!-- 3-Line Hamburger Button on Right -->
        <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle navigation menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <!-- Slide-Out Navigation Drawer -->
        <div class="nav-drawer" id="navDrawer">
            <div class="drawer-header">
                <span>Menu</span>
                <button type="button" class="close-drawer-btn" id="closeDrawerBtn">✕</button>
            </div>

            <nav class="drawer-links">
                <!-- Main Home & Views Navigation -->
                <a href="index.html">Home</a>
                <a href="index.html">Your Benefits</a>
                <a href="index.html">Our Impact</a>

                <hr class="nav-divider">

                <!-- External Pages & Actions -->
                <a href="sample_stories.html" style="background:#f0f2f5;">Sample Stories</a>
                <a href="books.html">Books on Thinking</a>
                <a href="https://wa.me/1234567890" target="_blank" rel="noopener noreferrer">Contact Us</a>

                <hr class="nav-divider">

                <!-- Member Portal & Registration Buttons -->
                <a href="https://member.thinkingskill.in" target="_blank" class="nav-btn-link login-btn">Member Login</a>
                <a href="index.html" class="nav-btn-link join-btn">Join Think Lab</a>
            </nav>
        </div>
    </header>

    <!-- Backdrop overlay to dismiss menu when clicking outside -->
    <div class="nav-backdrop" id="navBackdrop"></div>

    <div class="page-title">Sample Stories</div>
    <div class="subtitle">Explore interactive stories, audio scripts, and thinking challenges.</div>

    <!-- 1. LANGUAGE -->
    <div class="selector">
        <label for="language">Language</label>
        <select id="language">
            <option value="">Select Language</option>
        </select>
    </div>

    <!-- 2. STORY -->
    <div class="selector">
        <label for="story">Story</label>
        <select id="story" disabled>
            <option value="">Select Story / Voice</option>
        </select>
    </div>

    <!-- 3. SCRIPT -->
    <div class="selector">
        <label for="script">Script / Voice</label>
        <select id="script" disabled>
            <option value="">Select Script / Voice</option>
        </select>
    </div>

    <!-- MESSAGE -->
    <div id="message">Loading stories...</div>

    <div id="welcomeImage">
        <img src="https://lh3.googleusercontent.com/d/1yMNlUe-RYQeO9UfgDq17LHlnOlVPk0jD" alt="Family reading together">
    </div>

    <!-- CONTENT -->
    <div id="content">

        <!-- WATCH & WONDER -->
        <div id="watchSection" style="display:none;">
            <div class="activity-heading" id="watchActivityTitle">Watch & Wonder</div>
            <div id="videoWrapper" class="video-wrapper" style="display:none;"></div>
            <div id="watchTitle" class="story-title"></div>
            <div class="section">
                <div id="remarksText" class="section-text-remarks"></div>
            </div>
        </div>

        <div id="activitySeparator" class="activity-separator" style="display:none;"></div>

        <!-- READ & REFLECT -->
        <div id="readSection" style="display:none;">
            <div class="activity-heading" id="readActivityTitle">Read & Reflect</div>
            <img id="storyImage" class="story-image" src="" alt="Story image">
            <div id="readTitle" class="story-title"></div>
            <div class="section">
                <div id="storyText" class="section-text"></div>
            </div>
            <div class="value-box">
                <div id="valueText" class="section-text"></div>
            </div>
            <div class="challenge-box">
                <div id="challengeText" class="section-text"></div>
            </div>
        </div>

    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {

    /* =========================================================
       DRAWER CONTROLLER
       ========================================================= */
    const navDrawer = document.getElementById('navDrawer');
    const navBackdrop = document.getElementById('navBackdrop');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');

    function openNavDrawer() {
        if (navDrawer) navDrawer.classList.add('open');
        if (navBackdrop) navBackdrop.classList.add('active');
    }

    function closeNavDrawer() {
        if (navDrawer) navDrawer.classList.remove('open');
        if (navBackdrop) navBackdrop.classList.remove('active');
    }

    if (hamburgerBtn) hamburgerBtn.addEventListener('click', openNavDrawer);
    if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', closeNavDrawer);
    if (navBackdrop) navBackdrop.addEventListener('click', closeNavDrawer);

    /* =====================================================
       GOOGLE SHEET CSV
    ===================================================== */
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSun3NoHJpKXxxe3KcsnfPY96onT0MhDCnW2LDONTMNnesP5kK06IwHv_ecfwW9Vg/pub?gid=2139485608&single=true&output=csv";
    const IMAGE_BASE_URL = "https://lh3.googleusercontent.com/d/";

    let rows = [];
    let columns = {};

    const language = document.getElementById("language");
    const story = document.getElementById("story");
    const script = document.getElementById("script");
    const message = document.getElementById("message");
    const content = document.getElementById("content");
    const readSection = document.getElementById("readSection");
    const watchSection = document.getElementById("watchSection");
    const videoWrapper = document.getElementById("videoWrapper");
    const activitySeparator = document.getElementById("activitySeparator");

    function normalize(text) {
        return String(text || "")
            .replace(/^\uFEFF/, "")
            .trim()
            .toLowerCase()
            .replace(/[\s_\-\/]+/g, "");
    }

    function parseCSV(text) {
        const result = [];
        let row = [];
        let value = "";
        let insideQuotes = false;

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const next = text[i + 1];

            if (char === '"' && insideQuotes && next === '"') {
                value += '"';
                i++;
            } else if (char === '"') {
                insideQuotes = !insideQuotes;
            } else if (char === "," && !insideQuotes) {
                row.push(value);
                value = "";
            } else if ((char === "\n" || char === "\r") && !insideQuotes) {
                if (char === "\r" && next === "\n") {
                    i++;
                }
                row.push(value);
                result.push(row);
                row = [];
                value = "";
            } else {
                value += char;
            }
        }

        if (value !== "" || row.length > 0) {
            row.push(value);
            result.push(row);
        }

        return result;
    }

    function buildColumnIndex(headers) {
        const index = {};
        headers.forEach((header, position) => {
            index[normalize(header)] = position;
        });
        return index;
    }

    function getCell(row, columnName) {
        const position = columns[normalize(columnName)];
        if (position === undefined) {
            return "";
        }
        return String(row[position] || "").trim();
    }

    async function loadData() {
        try {
            message.textContent = "Loading stories...";
            const response = await fetch(CSV_URL);

            if (!response.ok) {
                throw new Error("Unable to load Google Sheet.");
            }

            const csv = await response.text();
            const parsed = parseCSV(csv);

            if (parsed.length < 2) {
                throw new Error("No story data found.");
            }

            const headers = parsed[0];
            columns = buildColumnIndex(headers);

            rows = parsed.slice(1).filter(row => row.some(cell => String(cell).trim() !== ""));

            populateLanguages();
            message.textContent = "Select a language to begin.";
        } catch (error) {
            console.error("Google Sheet error:", error);
            message.textContent = "Unable to load stories.";
        }
    }

    function populateLanguages() {
        language.innerHTML = '<option value="">Select Language</option>';
        const languages = new Set();

        rows.forEach(row => {
            const lang = getCell(row, "Language");
            if (lang) languages.add(lang);
        });

        languages.forEach(lang => {
            const option = document.createElement("option");
            option.value = lang;
            option.textContent = lang;
            language.appendChild(option);
        });
    }

    function updateActivityLanguage() {
        const isTamil = language.value === "Tamil" || language.value === "தமிழ்";
        const readTitle = document.getElementById("readActivityTitle");
        const watchTitle = document.getElementById("watchActivityTitle");

        if (isTamil) {
            readTitle.textContent = "படித்து சிந்திக்கவும்";
            watchTitle.textContent = "பார்த்து வியக்கவும்";
        } else {
            readTitle.textContent = "Read & Reflect";
            watchTitle.textContent = "Watch & Wonder";
        }
    }

    language.addEventListener("change", function() {
        const selectedLanguage = this.value;
        story.innerHTML = '<option value="">Select Story</option>';
        story.disabled = true;

        script.innerHTML = '<option value="">Select Script / Voice</option>';
        script.disabled = true;

        hideContent();
        document.getElementById("welcomeImage").style.display = "block";

        if (!selectedLanguage) {
            message.style.display = "block";
            message.textContent = "Select a language to begin.";
            return;
        }

        const titles = new Set();
        rows.forEach(row => {
            const rowLanguage = getCell(row, "Language");
            const title = getCell(row, "Title");
            if (rowLanguage === selectedLanguage && title) {
                titles.add(title);
            }
        });

        updateActivityLanguage();

        titles.forEach(title => {
            const option = document.createElement("option");
            option.value = title;
            option.textContent = title;
            story.appendChild(option);
        });

        story.disabled = titles.size === 0;
        message.style.display = "block";
        message.textContent = titles.size ? "Select a story." : "No stories found for this language.";
    });

    story.addEventListener("change", function() {
        const selectedStory = this.value;
        script.innerHTML = '<option value="">Select Script / Voice</option>';
        script.disabled = true;

        hideContent();
        document.getElementById("welcomeImage").style.display = "block";

        if (!selectedStory) {
            message.style.display = "block";
            message.textContent = "Select a story.";
            return;
        }

        const scripts = new Set();
        rows.forEach(row => {
            const rowLanguage = getCell(row, "Language");
            const rowTitle = getCell(row, "Title");
            const rowScript = getCell(row, "Script");

            if (rowLanguage === language.value && rowTitle === selectedStory && rowScript) {
                scripts.add(rowScript);
            }
        });

        scripts.forEach(scriptName => {
            const option = document.createElement("option");
            option.value = scriptName;
            option.textContent = scriptName;
            script.appendChild(option);
        });

        script.disabled = scripts.size === 0;
        message.style.display = "block";
        message.textContent = scripts.size ? "Select a script." : "No scripts found for this story.";
    });

    script.addEventListener("change", function() {
        const selectedScript = this.value;
        hideContent();
        document.getElementById("welcomeImage").style.display = "none";

        if (!selectedScript) {
            message.style.display = "block";
            message.textContent = "Select a script.";
            return;
        }

        const row = findSelectedRow();

        if (!row) {
            message.style.display = "block";
            message.textContent = "Story information not found.";
            return;
        }

        message.style.display = "none";
        updateActivityLanguage();
        content.style.display = "block";

        showRead(row);
        showWatch(row);

        if (readSection.style.display === "none" && watchSection.style.display === "none") {
            content.style.display = "none";
            message.style.display = "block";
            message.textContent = "No content available for this script.";
        }
    });

    function findSelectedRow() {
        const selectedLanguage = language.value;
        const selectedTitle = story.value;
        const selectedScript = script.value;

        return rows.find(row =>
            getCell(row, "Language") === selectedLanguage &&
            getCell(row, "Title") === selectedTitle &&
            getCell(row, "Script") === selectedScript
        );
    }

    function showRead(row) {
        const imageID = getCell(row, "Image ID");

        if (!imageID) {
            readSection.style.display = "none";
            return;
        }

        readSection.style.display = "block";
        const image = document.getElementById("storyImage");
        image.src = IMAGE_BASE_URL + imageID;
        image.style.display = "block";

        document.getElementById("readTitle").textContent = getCell(row, "Title");
        document.getElementById("storyText").textContent = getCell(row, "Story");
        document.getElementById("valueText").textContent = getCell(row, "Value");
        document.getElementById("challengeText").textContent = getCell(row, "PIE Challenge");
    }

    function showWatch(row) {
        const youtubeID = getCell(row, "YouTube ID").trim().replace(/\s/g, "");

        if (!youtubeID || !isValidYouTubeID(youtubeID)) {
            watchSection.style.display = "none";
            activitySeparator.style.display = "none";
            videoWrapper.innerHTML = "";
            videoWrapper.style.display = "none";
            return;
        }

        watchSection.style.display = "block";
        activitySeparator.style.display = "block";

        document.getElementById("watchTitle").textContent = getCell(row, "Title");
        document.getElementById("remarksText").textContent = getCell(row, "Remarks");

        videoWrapper.innerHTML = "";
        videoWrapper.style.display = "none";

        const embedURL = "https://www.youtube.com/embed/" + youtubeID + "?rel=0&playsinline=1";
        const iframe = document.createElement("iframe");
        iframe.src = embedURL;
        iframe.title = "Story Video";
        iframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
        iframe.setAttribute("allowfullscreen", "");
        iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");

        videoWrapper.appendChild(iframe);
        videoWrapper.style.display = "block";
    }

    function isValidYouTubeID(id) {
        return /^[A-Za-z0-9_-]{11}$/.test(id);
    }

    function hideContent() {
        content.style.display = "none";
        readSection.style.display = "none";
        watchSection.style.display = "none";
        activitySeparator.style.display = "none";
        videoWrapper.innerHTML = "";
        videoWrapper.style.display = "none";

        const image = document.getElementById("storyImage");
        image.removeAttribute("src");
        image.style.display = "none";
    }

    loadData();

});
</script>

</body>
</html>
