<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think Lab Member Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: transparent !important;
        }

        /* Fully Transparent Sticky Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 12px 18px;
            background: transparent;
        }

        /* Single Collapsible Dropdown Drawer */
        .about-dropdown {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out, border 0.4s ease-out;
            border: 1px solid transparent;
            border-radius: 14px;
            margin-bottom: 0;
            padding: 0 24px;
            background: rgba(255, 255, 255, 0.96);
        }
        .about-dropdown.show {
            max-height: 900px;
            overflow-y: auto;
            padding: 24px;
            border: 1px solid #e1e4e8;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .about-dropdown h3 {
            margin-top: 0;
            font-size: 18px;
            color: #1d2940;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-dropdown-btn {
            background: #f0f2f5;
            border: 1px solid #d0d5dd;
            color: #1d2940;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .close-dropdown-btn:hover {
            background: #e2e8f0;
        }

        /* Collapsible Advanced Filters Section */
        .advanced-filters {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 0;
        }
        .advanced-filters.show {
            max-height: 200px;
            opacity: 1;
        }

        .story-card {
            border-width: 2px;
            background: rgba(255, 255, 255, 0.85);
        }
        .story-card:nth-child(4n+1){border-color:#81D4FA;}
        .story-card:nth-child(4n+2){border-color:#CE93D8;}
        .story-card:nth-child(4n+3){border-color:#A5D6A7;}
        .story-card:nth-child(4n+4){border-color:#FFCC80;}
        
        .card-image-wrap {
            width: 100%;
            aspect-ratio: 16/10;
            background: #EAF7FF;
            overflow: hidden;
        }
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-image.no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #78909C;
            font-size: 14px;
            background: #F3F9FC;
        }
    </style>
</head>
<body class="text-stone-800 min-h-full flex flex-col font-sans antialiased bg-transparent">

    <!-- Global Loading Overlay (Positioned at Top) -->
    <div id="globalLoader" class="fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-xs flex items-start justify-center pt-16 transition-opacity duration-300">
        <div class="bg-white px-6 py-4 rounded-2xl shadow-lg border border-stone-200 flex items-center space-x-3">
            <span class="w-4 h-4 rounded-full bg-amber-600 animate-ping"></span>
            <span class="text-stone-800 font-medium text-sm">Loading stories & puzzles...</span>
        </div>
    </div>

    <!-- Transparent Sticky Header with Menu Buttons -->
    <header class="header">
        <nav class="flex items-center space-x-2">
            <button type="button" onclick="switchDrawer('announcements')" class="text-sm font-semibold text-stone-700 bg-white/80 hover:bg-white border border-stone-200/80 shadow-xs px-3.5 py-2 rounded-xl transition-all cursor-pointer flex items-center space-x-1.5 backdrop-blur-xs">
                <span>📢</span>
                <span>Announcements</span>
            </button>

                <span>🏆</span>
                <span>Contest</span>
                <span id="contestStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block" title="Contest Status"></span>
            </button>
        </nav>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 pt-4 pb-12 space-y-6 bg-transparent">

        <!-- ================= VIEW 1: PORTAL HUB ================= -->
        <div id="portalHubView" class="space-y-6 bg-transparent">

            <!-- SINGLE SHARED COLLAPSIBLE DRAWER -->
            <div id="sharedDrawer" class="about-dropdown">
                <h3>
                    <span id="drawerTitle">Drawer Title</span>
                    <button type="button" class="close-dropdown-btn" onclick="closeDrawer()">Close</button>
                </h3>
                <div class="pt-4 border-t border-stone-100 mt-3">
                    <div id="drawerContentArea" class="space-y-4">
                        <div class="animate-pulse space-y-2">
                            <div class="h-10 bg-stone-100 rounded-lg w-full"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Welcome Banner -->
            <div class="bg-white/80 backdrop-blur-xs rounded-2xl p-6 sm:p-8 shadow-sm border border-stone-200/80 relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-amber-100/50 rounded-full blur-2xl pointer-events-none"></div>
                <h2 class="text-2xl sm:text-3xl font-bold text-stone-900 mb-2">Your Membership Hub</h2>

            <!-- EXPLORE SECTION -->

                    <button id="navSomBtn" class="flex items-center justify-between p-4 rounded-xl bg-amber-50/90 hover:bg-amber-100 border border-amber-200 text-amber-900 font-medium transition-all cursor-pointer">
                        <span class="flex items-center space-x-3">
                            <span class="text-2xl">⭐</span>
                            <div class="text-left">
                                <strong class="block text-base">Featured Story & Puzzle</strong>
                                <small class="text-xs text-amber-700 opacity-80 block mt-0.5">Monthly Challenge</small>
                            </div>
                        </span>
                        <svg class="w-5 h-5 text-amber-600 flex-shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>

                    <button id="navStoriesBtn" class="flex items-center justify-between p-4 rounded-xl bg-sky-50/90 hover:bg-sky-100 border border-sky-200 text-sky-900 font-medium transition-all cursor-pointer">
                        <span class="flex items-center space-x-3">
                            <span class="text-2xl">📖</span>
                            <div class="text-left">
                                <strong class="block text-base">Story Library</strong>
                                <small class="text-xs text-sky-700 opacity-80 block mt-0.5">Explore moral stories</small>
                            </div>
                        </span>
                        <svg class="w-5 h-5 text-sky-600 flex-shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

                    <button id="navPuzzlesBtn" class="flex items-center justify-between p-4 rounded-xl bg-purple-50/90 hover:bg-purple-100 border border-purple-200 text-purple-900 font-medium transition-all cursor-pointer">
                        <span class="flex items-center space-x-3">
                            <span class="text-2xl">🧩</span>
                            <div class="text-left">
                                <strong class="block text-base">Puzzle Library</strong>
                                <small class="text-xs text-purple-700 opacity-80 block mt-0.5">Challenge your mind</small>
                            </div>
                        </span>
                        <svg class="w-5 h-5 text-purple-600 flex-shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>

        </div>

        <!-- ================= VIEW 2: BROWSER GRID & FILTERS ================= -->
        <section id="storyBrowserView" style="display:none;" class="bg-white/85 backdrop-blur-xs rounded-2xl p-6 sm:p-8 shadow-sm border border-stone-200/80">
            <div class="flex items-center justify-between mb-4">
                <button id="backToPortalBtn" class="inline-flex items-center px-4 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-medium text-sm transition-all cursor-pointer">
                    ← Back to Portal

                <div id="resultCount" class="text-xs font-semibold text-stone-500"></div>
            </div>

            <!-- Dedicated Section Title Row -->
            <div class="mb-6 flex items-center justify-between">
                <h3 id="browserSectionTitle" class="text-xl sm:text-2xl font-bold text-stone-900"></h3>
                <button type="button" id="toggleAdvancedBtn" onclick="toggleAdvancedFilters()" class="text-xs font-semibold text-stone-600 bg-stone-100 hover:bg-stone-200 border border-stone-200 px-3 py-2 rounded-xl transition-all cursor-pointer flex items-center space-x-1.5">
                    <span>⚙️</span>
                    <span id="advancedBtnText">Advanced Filters</span>
                </button>
            </div>

            <!-- Primary Filters (Language & Story/Puzzle) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Language</label>
                    <select id="language" class="w-full p-2.5 bg-white border border-stone-200 rounded-xl text-sm outline-none"></select>
                </div>
                <div>
                    <label id="storyFilterLabel" class="block text-xs font-semibold text-stone-600 mb-1">Story</label>
                    <select id="story" class="w-full p-2.5 bg-white border border-stone-200 rounded-xl text-sm outline-none"></select>

            <!-- Collapsible Advanced Filter (Focus / Script) -->

            <div id="browserMessage" class="text-center py-8 text-stone-500 text-sm">Loading activities...</div>

            <!-- Pagination -->

                <button id="prevPage" class="px-4 py-2 rounded-xl border border-stone-200 bg-white text-sm disabled:opacity-40 cursor-pointer">‹ Previous</button>
                <span id="pageInfo" class="text-xs text-stone-500">Page 1</span>
                <button id="nextPage" class="px-4 py-2 rounded-xl border border-stone-200 bg-white text-sm disabled:opacity-40 cursor-pointer">Next ›</button>
            </div>
        </section>

        <!-- ================= VIEW 3: INLINE READER VIEW ================= -->
        <div id="contentReaderView" style="display:none;" class="bg-white/90 backdrop-blur-xs rounded-2xl p-6 sm:p-8 shadow-sm border border-stone-200/80">
            <button id="backToBrowserBtn" class="inline-flex items-center px-4 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-medium text-sm transition-all mb-6 cursor-pointer">
                ← Back
            </button>

            <!-- Watch Section -->
            <div id="watchSection" style="display:none;" class="mb-8">
                <div id="watchActivityTitle" class="p-3 bg-amber-50 text-amber-900 font-bold rounded-xl mb-4 text-center">Watch & Wonder</div>
                <div id="videoWrapper" class="relative w-full pb-[56.25%] bg-black rounded-xl overflow-hidden mb-4"></div>
                <h3 id="watchTitle" class="text-xl font-bold text-stone-900 mb-2"></h3>
                <p id="remarksText" class="text-stone-600 text-sm whitespace-pre-line text-center"></p>
            </div>

            <div id="activitySeparator" class="h-px bg-stone-200 my-6" style="display:none;"></div>

            <!-- Read Section -->
            <div id="readSection" style="display:none;">
                <div id="readActivityTitle" class="p-3 bg-indigo-50 text-indigo-900 font-bold rounded-xl mb-4 text-center">Read & Reflect</div>

                <div id="puzzleDifficultyBadge" class="text-center mb-3" style="display:none;"></div>
                <h3 id="readTitle" class="text-2xl font-bold text-stone-900 mb-4 text-center"></h3>
                <div id="storyText" class="text-stone-700 text-base leading-relaxed whitespace-pre-line mb-6"></div>

                <div id="valueBox" class="p-4 bg-emerald-50 border-l-4 border-emerald-500 rounded-r-xl mb-4" style="display:none;">
                    <div id="valueText" class="text-stone-700 text-sm whitespace-pre-line"></div>
                </div>

                <div id="challengeBox" class="p-4 bg-amber-50 border-l-4 border-amber-500 rounded-r-xl" style="display:none;">
                    <div id="challengeText" class="text-stone-700 text-sm whitespace-pre-line"></div>
                </div>
            </div>
        </div>

    </main>

    <footer class="mt-auto border-t border-stone-200/50 py-6 text-center text-xs text-stone-500 bg-transparent">
        <p>&copy; 2026 Think Lab Member Portal. All rights reserved.</p>
    </footer>

    <script>
        const timestamp = new Date().getTime();
        const URLS = {
            storyOfTheMonth: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRapaeSLOo-X99hi59zuhd5t7y_oMVjkPJHtnViVBN3QiziaPM2412qTxMJUKZj_g/pub?gid=2139485608&single=true&output=csv&t=" + timestamp,
            allStories: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxdObb0jp4_UO_Qivk8qsWAr6ccWaKiXvZ2dy39X6oLNDD87baa6s4i_jFH8vxZQ/pub?gid=985774031&single=true&output=csv&t=" + timestamp,
            allPuzzles: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRECMZ6J0-PQ_UWFjmsv10MheHJKhbNirHaDg6DsJ42UvFwscaOjO5rqm-75qGyWg/pub?gid=2139485608&single=true&output=csv&t=" + timestamp,
            announcements: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQhB2rehm2BolIBbyZVUC4rJCqeOQHOATRXRhzyUA-75_C5DkSPBof5QsNG8vn87KK7wc3f1dgSCWA_/pub?gid=0&single=true&output=csv&t=" + timestamp
        };
        const IMAGE_BASE_URL = "https://lh3.googleusercontent.com/d/";
        const PAGE_SIZE = 1;
        
        let storyOfTheMonthRows = [], storyOfTheMonthColumns = {};
        let storyRows = [], storyColumns = {};
        let puzzleRows = [], puzzleColumns = {};
        let rawAnnouncements = ["Welcome to Think Lab!"];
        
        let currentRows = [], currentColumns = {}, currentMode = "stories";
        let filteredRows = [], currentPage = 1;
        let activeDrawerType = null;

        window.addEventListener('DOMContentLoaded', () => {
            fetchAnnouncements();
            preloadAllData();
        });

        // Single Shared Drawer Switcher Logic
        function switchDrawer(type) {
            const drawer = document.getElementById('sharedDrawer');
            const titleEl = document.getElementById('drawerTitle');

            if (activeDrawerType === type && drawer.classList.contains('show')) {
                closeDrawer();
                return;
            }

            activeDrawerType = type;
            if (type === 'announcements') {
                titleEl.textContent = "Latest Announcements";
                renderAnnouncementsContent();
            } else if (type === 'contest') {
                titleEl.textContent = "Thinking Contest Details";
                renderContestContent();
            }

            drawer.classList.add('show');
        }

        function closeDrawer() {
            const drawer = document.getElementById('sharedDrawer');
            drawer.classList.remove('show');
            activeDrawerType = null;
        }

        function toggleAdvancedFilters() {
            const container = document.getElementById('advancedFiltersContainer');
            container.classList.toggle('show');
        }

        function parseCSVLine(text) {
            let result = [], cell = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(cell.trim().replace(/^"|"$/g, '')); cell = ''; }
                else cell += char;
            }
            result.push(cell.trim().replace(/^"|"$/g, ''));
            return result;
        }

        function parseCSV(text) {
            const result = [];
            let row = [], value = "", insideQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], next = text[i + 1];
                if (char === '"' && insideQuotes && next === '"') { value += '"'; i++; }
                else if (char === '"') insideQuotes = !insideQuotes;
                else if (char === ',' && !insideQuotes) { row.push(value); value = ""; }
                else if ((char === "\n" || char === "\r") && !insideQuotes) {
                    if (char === "\r" && next === "\n") i++;
                    row.push(value); result.push(row); row = []; value = "";
                } else value += char;
            }
            if (value !== "" || row.length > 0) { row.push(value); result.push(row); }
            return result;
        }

        function buildColumnIndex(headers) {
            const map = {};
            headers.forEach((header, index) => {
                map[String(header || "").replace(/^\uFEFF/, "").trim().toLowerCase().replace(/[\s_\-\/]+/g, "")] = index;
            });
            return map;
        }

        async function fetchAnnouncements() {
            try {
                const res = await fetch(URLS.announcements);
                const csv = await res.text();
                const lines = csv.split('\n');
                let items = [];
                for (let line of lines) {
                    if (!line.trim()) continue;
                    let cols = parseCSVLine(line);
                    if (cols[0] && cols[0].toLowerCase() !== 'announcements') items.push(cols[0]);
                }
                rawAnnouncements = items.length ? items : ["Welcome to Think Lab!"];
            } catch (e) {
                rawAnnouncements = ["Welcome to Think Lab!"];
            }
        }

        function renderAnnouncementsContent() {
            const container = document.getElementById('drawerContentArea');
            container.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center space-x-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-xs text-stone-400 font-medium">Synced</span>
                    </div>
                </div>
                <div class="space-y-3">
                    ${rawAnnouncements.map((item, i) => `
                        <div class="flex items-start p-3 rounded-xl bg-stone-50 border border-stone-100">
                            <span class="w-6 h-6 rounded-full bg-amber-100 text-amber-800 font-semibold text-xs flex items-center justify-center mr-3 flex-shrink-0">${i + 1}</span>
                            <p class="text-stone-700 text-sm leading-relaxed">${item}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function preloadAllData() {
            try {
                const [somRes, storiesRes, puzzlesRes] = await Promise.all([
                    fetch(URLS.storyOfTheMonth),
                    fetch(URLS.allStories),
                    fetch(URLS.allPuzzles)
                ]);

                const somText = await somRes.text();
                const sText = await storiesRes.text();
                const pText = await puzzlesRes.text();

                const somParsed = parseCSV(somText);
                storyOfTheMonthColumns = buildColumnIndex(somParsed[0]);
                storyOfTheMonthRows = somParsed.slice(1).filter(r => r.some(c => String(c).trim() !== ""));

                const sParsed = parseCSV(sText);
                storyColumns = buildColumnIndex(sParsed[0]);
                storyRows = sParsed.slice(1).filter(r => r.some(c => String(c).trim() !== ""));

                const pParsed = parseCSV(pText);
                puzzleColumns = buildColumnIndex(pParsed[0]);
                puzzleRows = pParsed.slice(1).filter(r => r.some(c => String(c).trim() !== ""));

                updateContestStatusDot();
            } catch (e) {
                console.error("Data loading error:", e);
            } finally {
                const loader = document.getElementById('globalLoader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 300);
                }
            }
        }

        function getSomVal(row, colName) {
            const pos = storyOfTheMonthColumns[colName.toLowerCase().replace(/[\s_\-\/]+/g, "")];
            if (pos === undefined) return "";
            return String(row[pos] || "").trim();
        }

        function updateContestStatusDot() {
            const validContestRows = storyOfTheMonthRows.filter(r => getSomVal(r, "Start") !== "");
            if (!validContestRows || validContestRows.length === 0) return;
            const firstRow = validContestRows[0];
            const startStr = getSomVal(firstRow, "Start");
            const endStr = getSomVal(firstRow, "End");
            const dotEl = document.getElementById('contestStatusDot');

            const startDate = startStr ? new Date(startStr) : null;
            const endDate = endStr ? new Date(endStr) : null;
            if (endDate) endDate.setHours(23, 59, 59, 999);
            const now = new Date();

            if (startDate && endDate && !isNaN(startDate) && !isNaN(endDate)) {
                if (now < startDate) {
                    dotEl.className = "w-2.5 h-2.5 rounded-full bg-amber-400 inline-block";
                    dotEl.title = "Contest Upcoming";
                } else if (now > endDate) {
                    dotEl.className = "w-2.5 h-2.5 rounded-full bg-rose-500 inline-block";
                    dotEl.title = "Contest Completed";
                } else {
                    dotEl.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse";
                    dotEl.title = "Contest Live";
                }
            }
        }

        function renderContestContent() {
            const container = document.getElementById('drawerContentArea');
            const validContestRows = storyOfTheMonthRows.filter(r => getSomVal(r, "Start") !== "");

            if (!validContestRows || validContestRows.length === 0) {
                container.innerHTML = `<p class="text-sm text-stone-500">No active contest details found.</p>`;
                return;
            }

            const firstRow = validContestRows[0];
            const startStr = getSomVal(firstRow, "Start");
            const endStr = getSomVal(firstRow, "End");

            const startDate = startStr ? new Date(startStr) : null;
            const endDate = endStr ? new Date(endStr) : null;
            if (endDate) endDate.setHours(23, 59, 59, 999);

            const now = new Date();

            let statusHTML = '';
            let isContestActive = false;

            if (startDate && endDate && !isNaN(startDate) && !isNaN(endDate)) {
                if (now < startDate) {
                    statusHTML = `
                        <div class="p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-sm">
                            <strong>Contest Upcoming!</strong> This month's Thinking Contest runs from <strong>${startStr}</strong> to <strong>${endStr}</strong>. Please come back then to participate!
                        </div>
                    `;
                } else if (now > endDate) {
                    statusHTML = `
                        <div class="p-4 rounded-xl bg-stone-100 border border-stone-200 text-stone-700 text-sm">
                            <strong>Contest Concluded</strong> This month's Thinking Contest concluded on <strong>${endStr}</strong>. Thank you to everyone who participated! Stay tuned for the next challenge.
                        </div>
                    `;
                } else {
                    isContestActive = true;
                    statusHTML = `
                        <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm flex items-center justify-between">
                            <span>🟢 Contest is Live! (Runs from ${startStr} to ${endStr})</span>
                        </div>
                    `;
                }
            } else {
                isContestActive = true;
                statusHTML = `<p class="text-sm text-stone-600">Thinking Contest is currently open.</p>`;
            }

            const bannerImageHTML = `
                <div class="mt-4 pt-4 border-t border-stone-100 text-center">
                    <img src="${IMAGE_BASE_URL}1TC6imMKB0DcpgAY1oKQlaI5hDAMSvEGB" class="w-full max-h-[400px] object-contain rounded-xl mx-auto shadow-xs" alt="Thinking Contest Banner">
                </div>
            `;

            if (!isContestActive) {
                container.innerHTML = `
                    <div class="space-y-4">
                        ${statusHTML}
                        ${bannerImageHTML}
                    </div>
                `;
                return;
            }

            const itemMap = new Map();
            validContestRows.forEach(row => {
                const imgID = getSomVal(row, "Image ID");
                const title = getSomVal(row, "Title");
                const lang = getSomVal(row, "Language");
                const formUrl = getSomVal(row, "Form");

                if (!imgID) return;
                if (!itemMap.has(imgID)) {
                    itemMap.set(imgID, { imageID: imgID, entries: [] });
                }
                itemMap.get(imgID).entries.push({ title, lang, formUrl });
            });

            let cardsHTML = '';
            itemMap.forEach((item) => {
                let entryLinksHTML = item.entries.map(e => {
                    const label = e.lang ? `${e.title} (${e.lang})` : e.title;
                    if (e.formUrl) {
                        return `
                            <div class="mb-2">
                                <a href="${e.formUrl}" target="_blank" rel="noopener noreferrer" class="font-bold text-amber-700 hover:text-amber-800 hover:underline text-base sm:text-lg block">
                                    📌 ${label} ↗
                                </a>
                            </div>
                        `;
                    } else {
                        return `<span class="block font-bold text-stone-800 text-base sm:text-lg mb-1">📌 ${label}</span>`;
                    }
                }).join('');

                const fallbackTitle = item.entries[0] ? item.entries[0].title : "Featured Challenge";

                cardsHTML += `
                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 p-4 rounded-xl bg-stone-50 border border-stone-100">
                        <div class="w-full sm:w-32 aspect-video sm:aspect-square rounded-lg overflow-hidden flex-shrink-0 bg-sky-50 flex items-center justify-center">
                            <img src="${IMAGE_BASE_URL + item.imageID}" class="w-full h-full object-cover" alt="${fallbackTitle}">
                        </div>
                        <div class="flex-grow text-left w-full">
                            <span class="text-xs font-semibold text-amber-600 uppercase tracking-wider block mb-1">Comprehend & Tell (Quiz & Audio)</span>
                            <div class="space-y-2">
                                ${entryLinksHTML}
                            </div>
                            <p class="text-xs text-stone-500 mt-2">Click the story name above to participate.</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="space-y-4">
                    ${statusHTML}
                    <div class="grid grid-cols-1 gap-4">
                        ${cardsHTML}
                    </div>
                    ${bannerImageHTML}
                </div>
            `;
        }

        document.getElementById('navSomBtn').addEventListener('click', () => openBrowser("storyOfTheMonth"));
        document.getElementById('navStoriesBtn').addEventListener('click', () => openBrowser("stories"));
        document.getElementById('navPuzzlesBtn').addEventListener('click', () => openBrowser("puzzles"));
        document.getElementById('backToPortalBtn').addEventListener('click', showPortalHub);
        document.getElementById('backToBrowserBtn').addEventListener('click', () => {
            document.getElementById('contentReaderView').style.display = "none";
            document.getElementById('storyBrowserView').style.display = "block";
        });

        function openBrowser(mode) {
            currentMode = mode;
            let sectionTitleText = "";
            if (mode === "storyOfTheMonth") {
                currentRows = storyOfTheMonthRows;
                currentColumns = storyOfTheMonthColumns;
                sectionTitleText = "Featured Story & Puzzle";
            } else if (mode === "puzzles") {
                currentRows = puzzleRows;
                currentColumns = puzzleColumns;
                sectionTitleText = "Puzzle Library";
            } else {
                currentRows = storyRows;
                currentColumns = storyColumns;
                sectionTitleText = "Story Library";
            }

            document.getElementById('browserSectionTitle').textContent = sectionTitleText;

            document.getElementById('portalHubView').style.display = "none";
            document.getElementById('storyBrowserView').style.display = "block";
            document.getElementById('contentReaderView').style.display = "none";

            document.getElementById('storyFilterLabel').textContent = mode === "puzzles" ? "Puzzle" : "Story";
            populateFilters();
            renderGrid();
        }

        function showPortalHub() {
            document.getElementById('portalHubView').style.display = "block";
            document.getElementById('storyBrowserView').style.display = "none";
            document.getElementById('contentReaderView').style.display = "none";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getCellVal(row, colName) {
            const pos = currentColumns[colName.toLowerCase().replace(/[\s_\-\/]+/g, "")];
            if (pos === undefined) return "";
            return String(row[pos] || "").trim();
        }

        function uniqueValues(colName) {
            const set = new Set();
            currentRows.forEach(r => {
                const val = getCellVal(r, colName);
                if (val) set.add(val);
            });
            return Array.from(set).sort();
        }

        function populateFilters() {
            const langs = uniqueValues("Language");
            populateSelect("language", langs, langs[0] || "English");
            updateDependentFilters();
        }

        function populateSelect(id, values, defaultVal) {
            const el = document.getElementById(id);
            const currentSelected = el.value;
            el.innerHTML = `<option value="__ALL__">All</option>` + values.map(v => `<option value="${v}">${v}</option>`).join('');
            
            if (currentSelected && (values.includes(currentSelected) || currentSelected === "__ALL__")) {
                el.value = currentSelected;
            } else if (defaultVal && values.includes(defaultVal)) {
                el.value = defaultVal;
            } else {
                el.value = "__ALL__";
            }
        }

        function updateDependentFilters() {
            const lang = document.getElementById('language').value;
            const scriptFilter = document.getElementById('script').value;

            // 1. Base subset by Language
            let subset = lang === "__ALL__" ? currentRows : currentRows.filter(r => getCellVal(r, "Language").toLowerCase() === lang.toLowerCase());

            // 2. Determine Story options based on Language and optional Script filter
            let storySubset = subset;
            if (scriptFilter !== "__ALL__") {
                storySubset = subset.filter(r => getCellVal(r, "Script").toLowerCase() === scriptFilter.toLowerCase());
            }
            const titles = Array.from(new Set(storySubset.map(r => getCellVal(r, "Title")).filter(Boolean))).sort();
            populateSelect("story", titles);

            // 3. Determine Script options based on Language and optional Story filter
            let scriptSubset = subset;
            if (document.getElementById('story').value !== "__ALL__") {
                scriptSubset = subset.filter(r => getCellVal(r, "Title").toLowerCase() === document.getElementById('story').value.toLowerCase());
            }
            const scripts = Array.from(new Set(scriptSubset.map(r => getCellVal(r, "Script")).filter(Boolean))).sort();
            populateSelect("script", scripts);

            currentPage = 1;
            renderGrid();
        }

        document.getElementById('language').addEventListener('change', updateDependentFilters);
        document.getElementById('story').addEventListener('change', updateDependentFilters);
        document.getElementById('script').addEventListener('change', updateDependentFilters);

        function renderGrid() {
            const lang = document.getElementById('language').value;
            const storyFilter = document.getElementById('story').value;
            const scriptFilter = document.getElementById('script').value;

            filteredRows = currentRows.filter(r => {
                const img = getCellVal(r, "Image ID");
                const yt = getCellVal(r, "YouTube ID").replace(/\s/g, "");
                if (!img && !/^[A-Za-z0-9_-]{11}$/.test(yt)) return false;

                if (lang !== "__ALL__" && getCellVal(r, "Language").toLowerCase() !== lang.toLowerCase()) return false;
                if (storyFilter !== "__ALL__" && getCellVal(r, "Title").toLowerCase() !== storyFilter.toLowerCase()) return false;
                if (scriptFilter !== "__ALL__" && getCellVal(r, "Script").toLowerCase() !== scriptFilter.toLowerCase()) return false;
                return true;
            });

            const grid = document.getElementById('storyGrid');
            grid.innerHTML = "";

            const totalPages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;

            const pageRows = filteredRows.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

            if (pageRows.length === 0) {
                document.getElementById('browserMessage').style.display = "block";
                document.getElementById('browserMessage').textContent = "No items found.";
                document.getElementById('pagination').style.display = "none";
                document.getElementById('resultCount').textContent = "";
                return;
            }

            document.getElementById('browserMessage').style.display = "none";

            pageRows.forEach(row => {
                const title = getCellVal(row, "Title") || "Untitled";
                const langVal = getCellVal(row, "Language");
                const scriptVal = getCellVal(row, "Script");
                const imageID = getCellVal(row, "Image ID");
                
                let starsHTML = '';
                if (currentMode === "puzzles" || currentMode === "storyOfTheMonth") {
                    const remarksVal = getCellVal(row, "Remarks");
                    const diffNum = parseInt(remarksVal, 10);
                    if (!isNaN(diffNum) && diffNum >= 1 && diffNum <= 5) {
                        const filled = '★'.repeat(diffNum);
                        const empty = '☆'.repeat(5 - diffNum);
                        starsHTML = `<span class="px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold" title="Difficulty: ${diffNum}/5">${filled}${empty}</span>`;
                    }
                }

                const card = document.createElement('article');
                card.className = "story-card rounded-xl overflow-hidden shadow-xs cursor-pointer hover:shadow-md transition-all";
                card.innerHTML = `
                    <div class="card-image-wrap">
                        ${imageID ? `<img src="${IMAGE_BASE_URL + imageID}" class="card-image" loading="lazy" alt="${title}">` : `<div class="card-image no-image">View Content</div>`}
                    </div>
                    <div class="p-3.5">
                        <h4 class="font-bold text-stone-900 text-sm sm:text-base mb-2 line-clamp-1">${title}</h4>
                        <div class="flex flex-wrap gap-1.5">
                            ${langVal ? `<span class="px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 text-xs font-semibold">${langVal}</span>` : ''}
                            ${scriptVal ? `<span class="px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 text-xs font-semibold">${scriptVal}</span>` : ''}
                            ${starsHTML}
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => showContentReader(row));
                grid.appendChild(card);
            });

            document.getElementById('resultCount').textContent = `${filteredRows.length} item${filteredRows.length === 1 ? '' : 's'}`;
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevPage').disabled = currentPage <= 1;
            document.getElementById('nextPage').disabled = currentPage >= totalPages;
            document.getElementById('pagination').style.display = totalPages > 1 ? "flex" : "none";
        }

        document.getElementById('prevPage').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderGrid(); } });
        document.getElementById('nextPage').addEventListener('click', () => { 
            const totalPages = Math.ceil(filteredRows.length / PAGE_SIZE);
            if (currentPage < totalPages) { currentPage++; renderGrid(); } 
        });

        function showContentReader(row) {
            document.getElementById('storyBrowserView').style.display = "none";
            document.getElementById('portalHubView').style.display = "none";
            document.getElementById('contentReaderView').style.display = "block";

            const title = getCellVal(row, "Title");
            const storyText = getCellVal(row, "Story");
            const valueText = getCellVal(row, "Value");
            const challengeText = getCellVal(row, "PIE Challenge");
            const imageID = getCellVal(row, "Image ID");
            const ytID = getCellVal(row, "YouTube ID").replace(/\s/g, "");
            const remarks = getCellVal(row, "Remarks");

            const readSec = document.getElementById('readSection');
            if (storyText || title) {
                readSec.style.display = "block";
                document.getElementById('readTitle').textContent = title;
                document.getElementById('storyText').textContent = storyText;
                
                const img = document.getElementById('storyImage');
                if (imageID) { img.src = IMAGE_BASE_URL + imageID; img.style.display = "block"; } else img.style.display = "none";

                const badgeEl = document.getElementById('puzzleDifficultyBadge');
                if (currentMode === "puzzles" || currentMode === "storyOfTheMonth") {
                    const diffNum = parseInt(remarks, 10);
                    if (!isNaN(diffNum) && diffNum >= 1 && diffNum <= 5) {
                        const filled = '★'.repeat(diffNum);
                        const empty = '☆'.repeat(5 - diffNum);
                        badgeEl.innerHTML = `<span class="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold tracking-wide">Difficulty: ${filled}${empty} (${diffNum}/5)</span>`;
                        badgeEl.style.display = "block";
                    } else {
                        badgeEl.style.display = "none";
                    }
                } else {
                    badgeEl.style.display = "none";
                }

                const vBox = document.getElementById('valueBox');
                if (valueText) { document.getElementById('valueText').textContent = valueText; vBox.style.display = "block"; } else vBox.style.display = "none";

                const cBox = document.getElementById('challengeBox');
                if (challengeText) { document.getElementById('challengeText').textContent = challengeText; cBox.style.display = "block"; } else cBox.style.display = "none";
            } else {
                readSec.style.display = "none";
            }

            const watchSec = document.getElementById('watchSection');
            const separator = document.getElementById('activitySeparator');
            if (/^[A-Za-z0-9_-]{11}$/.test(ytID)) {
                watchSec.style.display = "block";
                separator.style.display = "block";
                document.getElementById('watchTitle').textContent = title;
                document.getElementById('remarksText').textContent = remarks;
                document.getElementById('videoWrapper').innerHTML = `<iframe src="https://www.youtube.com/embed/${ytID}?rel=0&playsinline=1" class="absolute inset-0 w-full h-full border-0" allowfullscreen></iframe>`;
            } else {
                watchSec.style.display = "none";
                separator.style.display = "none";
                document.getElementById('videoWrapper').innerHTML = "";
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
